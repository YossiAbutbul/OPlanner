<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafb"/>
      <stop offset="100%" stop-color="#eef5f0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1db954"/>
      <stop offset="100%" stop-color="#2bbe8a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="15%" r="50%">
      <stop offset="0%" stop-color="rgba(29,185,84,0.18)"/>
      <stop offset="100%" stop-color="rgba(29,185,84,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="rgba(52,152,219,0.15)"/>
      <stop offset="100%" stop-color="rgba(52,152,219,0)"/>
    </radialGradient>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glow1)"/>
  <rect width="1200" height="1200" fill="url(#glow2)"/>

  <!-- Brand row -->
  <g transform="translate(120 130)">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="#1a1a1a"/>
    <!-- Calendar icon -->
    <g stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="14" y="20" width="36" height="32" rx="4"/>
      <line x1="22" y1="14" x2="22" y2="26"/>
      <line x1="42" y1="14" x2="42" y2="26"/>
      <line x1="14" y1="32" x2="50" y2="32"/>
    </g>
    <text x="84" y="45" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="700" fill="#1a1a1a">OPlanner</text>
  </g>

  <!-- Hero text -->
  <text x="120" y="380" font-family="Inter, system-ui, sans-serif" font-size="92" font-weight="800" fill="#1a1a1a" letter-spacing="-2">Stop juggling</text>
  <text x="120" y="490" font-family="Inter, system-ui, sans-serif" font-size="92" font-weight="800" fill="#1a1a1a" letter-spacing="-2">tabs.</text>
  <text x="120" y="600" font-family="Inter, system-ui, sans-serif" font-size="92" font-weight="800" fill="url(#accent)" letter-spacing="-2">Ship the semester.</text>

  <!-- Subtitle -->
  <text x="120" y="680" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="400" fill="#555">Track assignments. Count down to finals.</text>
  <text x="120" y="725" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="400" fill="#555">All in one place.</text>

  <!-- Sample course cards -->
  <g transform="translate(120 820)" filter="url(#cardshadow)">
    <rect width="440" height="100" rx="14" fill="#fff" stroke="#e3e3e6"/>
    <circle cx="32" cy="34" r="7" fill="#1db954"/>
    <text x="56" y="42" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#1a1a1a">Operating Systems</text>
    <rect x="380" y="22" width="42" height="26" rx="13" fill="#dcfce7" stroke="#86efac"/>
    <text x="401" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#166534">12d</text>
    <rect x="20" y="60" width="400" height="8" rx="4" fill="#ececef"/>
    <rect x="20" y="60" width="288" height="8" rx="4" fill="url(#accent)"/>
    <text x="20" y="92" font-family="Inter, sans-serif" font-size="16" fill="#777">7 / 10 tasks</text>
  </g>

  <g transform="translate(620 870)" filter="url(#cardshadow)">
    <rect width="440" height="100" rx="14" fill="#fff" stroke="#e3e3e6"/>
    <circle cx="32" cy="34" r="7" fill="#9b59b6"/>
    <text x="56" y="42" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#1a1a1a">Algorithms</text>
    <rect x="380" y="22" width="42" height="26" rx="13" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="401" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">3d</text>
    <rect x="20" y="60" width="400" height="8" rx="4" fill="#ececef"/>
    <rect x="20" y="60" width="360" height="8" rx="4" fill="url(#accent)"/>
    <text x="20" y="92" font-family="Inter, sans-serif" font-size="16" fill="#777">9 / 10 tasks</text>
  </g>

  <!-- Footer URL -->
  <text x="120" y="1100" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#888">oplanner-one.vercel.app</text>
</svg>
