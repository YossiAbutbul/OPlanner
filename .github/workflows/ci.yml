name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight CI for a branch when a newer push lands — saves runners
# from chasing stale commits on fast iteration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI only checks out and builds.
permissions:
  contents: read

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # tsc has its own check independent of vite build's esbuild pass.
        # Build mode (-b) walks the whole solution — the root project and
        # both references. Checking tsconfig.app.json alone left root-level
        # project wiring unverified, which is how a TS6305 collision there
        # reached main while CI stayed green.
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
