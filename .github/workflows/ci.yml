name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight CI for a branch when a newer push lands — saves runners
# from chasing stale commits on fast iteration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # tsc has its own check independent of vite build's esbuild pass.
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
